<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Golf Ghost Analyzer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            width: 100%;
        }
        .controls {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        canvas {
            background-color: #000;
            border-radius: 8px;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        /* Hidden video elements used for processing */
        #proVideo, #webcamVideo {
            display: none; 
        }
        #status {
            font-weight: bold;
            color: #00ffcc;
            margin-top: 10px;
        }
        button, input::file-selector-button {
            background: #00ffcc;
            border: none;
            color: #000;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏌️ Live Golf Ghost Analyzer</h2>
    
    <div class="controls">
        <p>1. Upload a <b>short (under 5s)</b> video of a pro swing.</p>
        <input type="file" id="videoUpload" accept="video/mp4,video/mov">
        <div id="status">Waiting for video upload...</div>
    </div>

    <canvas id="outputCanvas" width="640" height="480"></canvas>
    
    <video id="proVideo" playsinline muted></video>
    <video id="webcamVideo" playsinline muted autoplay></video>
</div>

<script>
    // --- State and Variables ---
    let appState = 'WAITING'; // WAITING -> PROCESSING_PRO -> LIVE
    let proFramesData = [];
    
    // DOM Elements
    const videoUpload = document.getElementById('videoUpload');
    const proVideo = document.getElementById('proVideo');
    const webcamVideo = document.getElementById('webcamVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');

    // --- Math & Normalization Logic ---
    function getNormalizedFeatures(landmarks) {
        // Indices: L/R Shoulders(11,12), L/R Elbows(13,14), L/R Wrists(15,16)
        // L/R Hips(23,24), L/R Knees(25,26), L/R Ankles(27,28)
        const keyIndices = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
        const points = keyIndices.map(i => ({ x: landmarks[i].x, y: landmarks[i].y }));
        
        // Mid-hip (anchor point)
        const midHip = {
            x: (points[6].x + points[7].x) / 2,
            y: (points[6].y + points[7].y) / 2
        };
        
        // Mid-shoulder (for scale calculation)
        const midShoulder = {
            x: (points[0].x + points[1].x) / 2,
            y: (points[0].y + points[1].y) / 2
        };
        
        // Calculate torso length. Math.hypot calculates Euclidean distance.
        let torsoLength = Math.hypot(midShoulder.x - midHip.x, midShoulder.y - midHip.y);
        if (torsoLength < 1e-5) torsoLength = 1e-5; // Prevent division by zero
        
        // Normalize: Center at mid-hip and divide by torso length
        let features = [];
        points.forEach(p => {
            features.push((p.x - midHip.x) / torsoLength);
            features.push((p.y - midHip.y) / torsoLength);
        });
        
        return features;
    }

    function calculateDistance(f1, f2) {
        let sum = 0;
        for (let i = 0; i < f1.length; i++) {
            sum += Math.pow(f1[i] - f2[i], 2);
        }
        return Math.sqrt(sum);
    }

    // --- Create Colored Ghost Mask ---
    function createGhostCanvas(segmentationMask) {
        // We render the MediaPipe segmentation mask into an off-screen canvas
        // and colorize it so we can easily draw it later over the webcam.
        const offCanvas = document.createElement('canvas');
        offCanvas.width = canvasElement.width;
        offCanvas.height = canvasElement.height;
        const ctx = offCanvas.getContext('2d');

        // Draw the raw AI mask
        ctx.drawImage(segmentationMask, 0, 0, offCanvas.width, offCanvas.height);

        // Colorize it (Cyan with 60% opacity)
        ctx.globalCompositeOperation = 'source-in';
        ctx.fillStyle = 'rgba(0, 255, 200, 0.6)'; // Ghost Color
        ctx.fillRect(0, 0, offCanvas.width, offCanvas.height);

        return offCanvas;
    }

    // --- MediaPipe Pose Setup ---
    const pose = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    
    pose.setOptions({
        modelComplexity: 1, // 1 is a good balance for Web speed vs accuracy
        smoothLandmarks: true,
        enableSegmentation: true, // Required for the silhouette!
        smoothSegmentation: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function onResults(results) {
        if (!results.poseLandmarks || !results.segmentationMask) return;

        const features = getNormalizedFeatures(results.poseLandmarks);

        if (appState === 'PROCESSING_PRO') {
            // Store the pro frame data
            const ghostCanvas = createGhostCanvas(results.segmentationMask);
            proFramesData.push({
                features: features,
                ghost: ghostCanvas
            });
            
            // Draw progress to screen so the user sees it working
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            statusText.innerText = `Analyzing Pro Video... Saved ${proFramesData.length} frames.`;
            
        } else if (appState === 'LIVE') {
            // 1. Draw Live Webcam Feed
            canvasCtx.save();
            // Mirror the webcam feed horizontally for a natural feel
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();

            // 2. Find closest Pro frame
            let bestMatchIdx = 0;
            let minDistance = Infinity;
            
            for (let i = 0; i < proFramesData.length; i++) {
                let dist = calculateDistance(features, proFramesData[i].features);
                if (dist < minDistance) {
                    minDistance = dist;
                    bestMatchIdx = i;
                }
            }

            // 3. Draw the Ghost Overlay
            const bestGhost = proFramesData[bestMatchIdx].ghost;
            
            // Note: We mirror the ghost mask so it matches your mirrored webcam feed
            canvasCtx.save();
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(bestGhost, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();
        }
    }

    // --- Video Upload & Processing Pipeline ---
    videoUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        appState = 'PROCESSING_PRO';
        proFramesData = []; // Clear old data
        statusText.innerText = "Loading video...";
        
        const url = URL.createObjectURL(file);
        proVideo.src = url;
        proVideo.load();
    });

    proVideo.addEventListener('loadeddata', async () => {
        statusText.innerText = "Starting analysis...";
        proVideo.play();
        
        // Loop to send frames to MediaPipe while the video plays
        async function processVideoFrame() {
            if (proVideo.paused || proVideo.ended) {
                // Done processing!
                statusText.innerText = "Pro Video Processed! Starting Webcam...";
                appState = 'LIVE';
                startWebcam();
                return;
            }
            await pose.send({image: proVideo});
            requestAnimationFrame(processVideoFrame);
        }
        processVideoFrame();
    });

    // --- Live Webcam Pipeline ---
    function startWebcam() {
        const camera = new Camera(webcamVideo, {
            onFrame: async () => {
                if (appState === 'LIVE') {
                    await pose.send({image: webcamVideo});
                }
            },
            width: 640,
            height: 480
        });
        camera.start();
        statusText.innerText = "Live! Step into the frame.";
        statusText.style.color = "#00ff00";
    }

</script>
</body>
</html>
