<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D Putter Simulator Pro</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #2e8b57; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #ui-container { 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 10; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 85%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            font-weight: bold;
            background: #e74c3c; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%;
            transition: 0.2s;
        }
        button:active { background: #c0392b; }
        .slider-group {
            background: #f9f9f9;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        .slider-container label { flex-shrink: 0; width: 90px; }
        input[type="range"] { flex-grow: 1; }
        .val-display { width: 45px; text-align: right; color: #e74c3c; }

        /* ---- Tuning Panel ---- */
        .tuning-panel {
            background: #f0f4f8;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #bcd;
            font-size: 12px;
            color: #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tuning-panel strong {
            font-size: 13px;
            color: #222;
        }
        .tune-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tune-row label {
            flex-shrink: 0;
            width: 62px;
            font-weight: bold;
            color: #555;
        }
        .tune-row input[type="number"] {
            width: 64px;
            padding: 5px 4px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        .tune-row span {
            color: #888;
            font-size: 11px;
        }
        .tune-btns {
            display: flex;
            gap: 6px;
        }
        .tune-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
            transition: 0.15s;
            width: auto;
        }
        .tune-btn-speed  { background: #27ae60; }
        .tune-btn-speed:active  { background: #1e8449; }
        .tune-btn-stimp  { background: #8e44ad; }
        .tune-btn-stimp:active  { background: #6c3483; }
        .tune-btn-both   { background: #2980b9; }
        .tune-btn-both:active   { background: #1f618d; }

        .tune-result {
            font-size: 11px;
            color: #555;
            min-height: 16px;
            text-align: center;
            font-style: italic;
        }

        #status { 
            font-weight: 600; 
            color: #555; 
            text-align: center;
            font-size: 13px;
            margin-top: 2px;
        }
        .data-display {
            font-size: 16px;
            font-weight: 900;
            color: #333; 
            text-align: center;
            background: #f0f8ff;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #e74c3c;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .dist { color: #b22222; font-size: 20px; }
        .dir  { color: #2E8B57; font-size: 14px; }
        
        #cameraContainer {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 120px;
            height: 90px;
            border: 3px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            z-index: 20;
            background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #trackerCanvas { width: 100%; height: 100%; }

        #holdBadge {
            display: none;
            position: absolute;
            bottom: 18px;
            right: 18px;
            width: 114px;
            text-align: center;
            background: rgba(230, 126, 34, 0.92);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 3px 0;
            border-radius: 0 0 6px 6px;
            z-index: 25;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui-container">
    <div style="text-align:center; font-weight:bold; color:#333; font-size:13px;">Phone between feet, back camera facing putter face.</div>

    <!-- Current sliders -->
    <div class="slider-group">
        <div class="slider-container">
            <label>Club Sensitivity:</label>
            <input type="range" id="clubSensitivity" min="0.001" max="1.000" step="0.001" value="0.250">
            <span id="clubSensitivityValue" class="val-display">0.250</span>
        </div>
        <div class="slider-container">
            <label>Stimp (Green):</label>
            <input type="range" id="stimp" min="4" max="20" step="0.1" value="10.0">
            <span id="stimpValue" class="val-display">10.0</span>
        </div>
    </div>

    <!-- Manual tuning panel -->
    <div class="tuning-panel">
        <strong>🎯 Tune by Putt Result</strong>
        <div class="tune-row">
            <label>App yards:</label>
            <input type="number" id="tuneApp" placeholder="e.g. 8.5" step="0.1" min="0">
            <span>(what app showed)</span>
        </div>
        <div class="tune-row">
            <label>Real yards:</label>
            <input type="number" id="tuneReal" placeholder="e.g. 6.0" step="0.1" min="0">
            <span>(where ball stopped)</span>
        </div>
        <div class="tune-btns">
            <button class="tune-btn tune-btn-speed"  id="tuneSpeedBtn">Fix Club Speed</button>
            <button class="tune-btn tune-btn-stimp"  id="tuneStimpBtn">Fix Stimp</button>
            <button class="tune-btn tune-btn-both"   id="tuneBothBtn">Fix Both</button>
        </div>
        <div class="tune-result" id="tuneResult">Enter a putt result above to tune.</div>
    </div>

    <button id="startBtn">Start Camera Tracking</button>
    <div id="status">Waiting for camera...</div>

    <div class="data-display">
        <div id="distanceDisplay" class="dist">Dist: 0y 0f</div>
        <div id="directionDisplay" class="dir">Face: Locked Square</div>
    </div>
</div>

<div id="cameraContainer">
    <canvas id="trackerCanvas"></canvas>
</div>
<div id="holdBadge">⏸ BACKSWING HOLD</div>

<script>
    // --- 1. THREE.JS SCENE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5, 6, 2);
    const TEE_POS = { x: -0.16, y: -2.475, z: 0.45 };
    camera.lookAt(TEE_POS.x - 1, TEE_POS.y, TEE_POS.z);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(40, 40, 0xffffff, 0xffffff);
    gridHelper.position.y = -2.575;
    gridHelper.material.opacity = 0.3;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- 2. MANNEQUIN ---
    const skinMat  = new THREE.MeshLambertMaterial({ color: 0xffccaa });
    const shirtMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
    const pantsMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const clubMat  = new THREE.MeshLambertMaterial({ color: 0xdcdcdc });
    const gripMat  = new THREE.MeshLambertMaterial({ color: 0x111111 });

    const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 2), pantsMat);
    leftLeg.position.set(-0.4, 0, 0); scene.add(leftLeg);
    const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 2), pantsMat);
    rightLeg.position.set(0.4, 0, 0); scene.add(rightLeg);
    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.6), shirtMat);
    torso.position.set(0, 1.9, 0); scene.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4), skinMat);
    head.position.set(0, 3.2, 0); scene.add(head);

    const pivot = new THREE.Group();
    pivot.position.set(0, 2.5, 0.4);
    pivot.rotation.order = "YXZ";
    scene.add(pivot);

    const arms = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 2), skinMat);
    arms.position.set(0, -1, 0); pivot.add(arms);
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.8), gripMat);
    grip.position.set(0, -2.2, 0); pivot.add(grip);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 2.5), clubMat);
    shaft.position.set(0, -3.8, 0); pivot.add(shaft);
    const clubHead = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.3), clubMat);
    clubHead.position.set(0.15, -5, 0.05); pivot.add(clubHead);

    const ballRadius = 0.1;
    const ball = new THREE.Mesh(
        new THREE.SphereGeometry(ballRadius, 32, 32),
        new THREE.MeshLambertMaterial({ color: 0xffffff })
    );
    ball.position.set(TEE_POS.x, TEE_POS.y, TEE_POS.z);
    scene.add(ball);

    // --- 3. STATE ---
    let targetRotZ = 0, currRotZ = 0;
    let ballVelX = 0, ballVelZ = 0;
    let lastClubPos = new THREE.Vector3();
    let currentClubPos = new THREE.Vector3();

    const HOLD_FRAME_THRESHOLD = 4;
    let missingFrames = 0, inBackswingHold = false, frozenRotZ = 0;
    const holdBadge = document.getElementById('holdBadge');

    // --- 4. SLIDERS ---
    const sensitivitySlider   = document.getElementById('clubSensitivity');
    const sensitivityValueEl  = document.getElementById('clubSensitivityValue');
    sensitivitySlider.addEventListener('input', () => {
        sensitivityValueEl.innerText = parseFloat(sensitivitySlider.value).toFixed(3);
    });

    const stimpSlider  = document.getElementById('stimp');
    const stimpValueEl = document.getElementById('stimpValue');
    stimpSlider.addEventListener('input', () => {
        stimpValueEl.innerText = parseFloat(stimpSlider.value).toFixed(1);
    });

    // --- 5. TUNING LOGIC ---
    // The physics chain is:
    //   distance ∝ clubSpeed²  / (2 * friction)   where friction = 0.0012 * (10 / stimp)
    //   clubSpeed = rawBlobSpeed * sensitivity * 0.8 * physicsScale (= 1.5)
    //
    // So:  realYards / appYards = ratio
    //
    // Fix Club Speed only  → sensitivity scales by sqrt(ratio)   (speed is squared → distance)
    // Fix Stimp only       → stimp scales by ratio               (friction is linear → distance)
    // Fix Both             → split evenly: sensitivity *= ratio^(1/4), stimp *= sqrt(ratio)

    function getTuneInputs() {
        const app  = parseFloat(document.getElementById('tuneApp').value);
        const real = parseFloat(document.getElementById('tuneReal').value);
        return { app, real };
    }

    function applyTune(newSens, newStimp, msg) {
        if (newSens !== null) {
            newSens = Math.max(0.001, Math.min(1.000, newSens));
            sensitivitySlider.value     = newSens;
            sensitivityValueEl.innerText = newSens.toFixed(3);
        }
        if (newStimp !== null) {
            newStimp = Math.max(4.0, Math.min(20.0, newStimp));
            stimpSlider.value   = newStimp;
            stimpValueEl.innerText = newStimp.toFixed(1);
        }
        document.getElementById('tuneResult').innerText = msg;
    }

    document.getElementById('tuneSpeedBtn').addEventListener('click', () => {
        const { app, real } = getTuneInputs();
        if (!app || !real || app <= 0) {
            document.getElementById('tuneResult').innerText = '⚠️ Enter valid App & Real yards first.';
            return;
        }
        const ratio   = real / app;
        const curSens = parseFloat(sensitivitySlider.value);
        // Distance ∝ speed² → to scale distance by ratio, scale speed by sqrt(ratio)
        const newSens = curSens * Math.sqrt(ratio);
        applyTune(newSens, null,
            `Club Speed → ${newSens.toFixed(3)}  (was ${curSens.toFixed(3)}, ratio ${ratio.toFixed(3)})`);
    });

    document.getElementById('tuneStimpBtn').addEventListener('click', () => {
        const { app, real } = getTuneInputs();
        if (!app || !real || app <= 0) {
            document.getElementById('tuneResult').innerText = '⚠️ Enter valid App & Real yards first.';
            return;
        }
        const ratio     = real / app;
        const curStimp  = parseFloat(stimpSlider.value);
        // Distance ∝ 1/friction ∝ stimp → scale stimp by ratio directly
        const newStimp  = curStimp * ratio;
        applyTune(null, newStimp,
            `Stimp → ${newStimp.toFixed(1)}  (was ${curStimp.toFixed(1)}, ratio ${ratio.toFixed(3)})`);
    });

    document.getElementById('tuneBothBtn').addEventListener('click', () => {
        const { app, real } = getTuneInputs();
        if (!app || !real || app <= 0) {
            document.getElementById('tuneResult').innerText = '⚠️ Enter valid App & Real yards first.';
            return;
        }
        const ratio    = real / app;
        const curSens  = parseFloat(sensitivitySlider.value);
        const curStimp = parseFloat(stimpSlider.value);
        // Split error evenly: sens contribution is squared, stimp is linear
        // To split evenly in log space: sens *= ratio^(1/4), stimp *= ratio^(1/2)
        const newSens  = curSens  * Math.pow(ratio, 0.25);
        const newStimp = curStimp * Math.pow(ratio, 0.50);
        applyTune(newSens, newStimp,
            `Both adjusted — Speed: ${newSens.toFixed(3)}, Stimp: ${newStimp.toFixed(1)}`);
    });

    // --- 6. CAMERA SETUP ---
    const videoElement = document.createElement('video');
    videoElement.setAttribute('playsinline', '');
    videoElement.setAttribute('autoplay', '');

    const trackerCanvas = document.getElementById('trackerCanvas');
    const ctx = trackerCanvas.getContext('2d', { willReadFrequently: true });
    const C_WIDTH = 160, C_HEIGHT = 120;
    trackerCanvas.width = C_WIDTH; trackerCanvas.height = C_HEIGHT;

    let cameraActive = false;
    const startBtn = document.getElementById('startBtn');
    const statusTxt = document.getElementById('status');
    const distanceDisplay = document.getElementById('distanceDisplay');

    startBtn.addEventListener('click', async () => {
        const tryStream = async (exact) => navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: exact ? { exact: "environment" } : "environment",
                width:  { ideal: C_WIDTH },
                height: { ideal: C_HEIGHT }
            }
        });
        let stream = null;
        try { stream = await tryStream(true); }
        catch (_) {
            try { stream = await tryStream(false); }
            catch (err) { statusTxt.innerText = "Error: Allow Camera Access!"; return; }
        }
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
            videoElement.play();
            cameraActive = true;
            startBtn.style.display = 'none';
            statusTxt.innerText = "Back Camera Active! Move red putter.";
        };
    });

    const MIN_BLOB_PX = 15;

    function trackRedShaft() {
        if (!cameraActive || videoElement.readyState !== videoElement.HAVE_ENOUGH_DATA) return;

        ctx.drawImage(videoElement, 0, 0, C_WIDTH, C_HEIGHT);
        const frame = ctx.getImageData(0, 0, C_WIDTH, C_HEIGHT);
        const data  = frame.data;

        let sumX = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            if (r > 130 && r > g * 1.6 && r > b * 1.6) {
                sumX += (i / 4) % C_WIDTH;
                count++;
                data[i] = 255; data[i+1] = 0; data[i+2] = 255;
            }
        }
        ctx.putImageData(frame, 0, 0);

        if (count >= MIN_BLOB_PX) {
            missingFrames = 0;
            if (inBackswingHold) { inBackswingHold = false; holdBadge.style.display = 'none'; }

            const avgX        = sumX / count;
            const normalizedX = ((avgX / C_WIDTH) - 0.5) * 2;
            const sensitivity = parseFloat(sensitivitySlider.value);
            const newTarget   = normalizedX * 0.8 * sensitivity;

            targetRotZ = newTarget;
            frozenRotZ = newTarget;
        } else {
            missingFrames++;
            if (!inBackswingHold && missingFrames >= HOLD_FRAME_THRESHOLD) {
                inBackswingHold = true;
                holdBadge.style.display = 'block';
            }
            if (inBackswingHold) targetRotZ = frozenRotZ;
        }
    }

    function calculateDistance(velX, velZ, friction) {
        const v0 = Math.sqrt(velX * velX + velZ * velZ);
        const rawYards = ((v0 * v0) / (2 * friction)) * 3.5;
        let yards = Math.floor(rawYards);
        let feet  = Math.round((rawYards - yards) * 3);
        if (feet === 3) { yards++; feet = 0; }
        return { yards, feet };
    }

    // --- 7. ANIMATION & PHYSICS ---
    function animate() {
        requestAnimationFrame(animate);
        trackRedShaft();

        currRotZ += (targetRotZ - currRotZ) * 0.15;
        pivot.rotation.z = currRotZ;

        clubHead.getWorldPosition(currentClubPos);
        const currentStimp    = parseFloat(stimpSlider.value);
        const dynamicFriction = 0.0012 * (10 / currentStimp);

        if (ballVelX === 0 && ballVelZ === 0) {
            const faceWorldX     = currentClubPos.x - 0.2;
            const lastFaceWorldX = lastClubPos.x - 0.2;
            const ballRightEdge  = ball.position.x + ballRadius;

            if (lastFaceWorldX > ballRightEdge && faceWorldX <= ballRightEdge) {
                const clubSpeed = Math.abs(currentClubPos.x - lastClubPos.x);
                if (clubSpeed > 0.005) {
                    // Smash factor is always 1
                    ballVelX = -clubSpeed * 1.0 * 1.5;

                    const d = calculateDistance(ballVelX, ballVelZ, dynamicFriction);
                    distanceDisplay.innerText = `Dist: ${d.yards}y ${d.feet}f`;

                    setTimeout(() => {
                        ballVelX = 0; ballVelZ = 0;
                        ball.position.set(TEE_POS.x, TEE_POS.y, TEE_POS.z);
                    }, 4000);
                }
            }
        }

        lastClubPos.copy(currentClubPos);

        if (Math.abs(ballVelX) > 0 || Math.abs(ballVelZ) > 0) {
            ball.position.x += ballVelX;
            ball.position.z += ballVelZ;
            const speed = Math.sqrt(ballVelX * ballVelX + ballVelZ * ballVelZ);
            if (speed > dynamicFriction) {
                const dropX = (Math.abs(ballVelX) / speed) * dynamicFriction;
                const dropZ = (Math.abs(ballVelZ) / speed) * dynamicFriction;
                ballVelX = ballVelX > 0 ? Math.max(0, ballVelX - dropX) : Math.min(0, ballVelX + dropX);
                ballVelZ = ballVelZ > 0 ? Math.max(0, ballVelZ - dropZ) : Math.min(0, ballVelZ + dropZ);
            } else {
                ballVelX = 0; ballVelZ = 0;
            }
        }

        renderer.render(scene, camera);
    }

    clubHead.getWorldPosition(lastClubPos);
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
