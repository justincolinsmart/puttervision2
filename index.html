<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Pro Putter - Back Camera</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #2e8b57; font-family: sans-serif; }
        #ui-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); width: 85%; max-width: 400px; }
        button { padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .data-display { font-size: 16px; font-weight: 900; color: #333; text-align: center; background: #f0f8ff; padding: 8px; border-radius: 8px; border: 2px solid #e74c3c; margin-top: 10px; }
        #cameraContainer { position: absolute; bottom: 15px; right: 15px; width: 120px; height: 90px; border: 3px solid #fff; border-radius: 8px; overflow: hidden; z-index: 20; background: #000; }
        #trackerCanvas { width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div style="font-size: 12px; text-align:center;">Back Camera: Mount phone close to putter.</div>
        <button id="startBtn">Start Back Camera</button>
        <div id="status">Waiting...</div>
        <div class="data-display">
            <div id="distanceDisplay">Dist: 0y 0f</div>
        </div>
    </div>

    <div id="cameraContainer">
        <canvas id="trackerCanvas"></canvas>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 10);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // State
        let lastKnownX = 0;
        let ballVelX = 0;
        let cameraActive = false;
        const videoElement = document.createElement('video');
        const trackerCanvas = document.getElementById('trackerCanvas');
        const ctx = trackerCanvas.getContext('2d', { willReadFrequently: true });
        const C_WIDTH = 160, C_HEIGHT = 120;
        trackerCanvas.width = C_WIDTH; trackerCanvas.height = C_HEIGHT;

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                // Requesting back camera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" }, width: C_WIDTH, height: C_HEIGHT } 
                });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    cameraActive = true;
                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('status').innerText = "Tracking Back Camera...";
                };
            } catch (err) {
                document.getElementById('status').innerText = "Camera Error: Back camera might be blocked or unavailable.";
            }
        });

        function trackRedShaft() {
            if (!cameraActive) return lastKnownX;

            ctx.drawImage(videoElement, 0, 0, C_WIDTH, C_HEIGHT);
            const frame = ctx.getImageData(0, 0, C_WIDTH, C_HEIGHT);
            const data = frame.data;
            let sumX = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
                // Detecting intense red
                if (data[i] > 150 && data[i] > data[i+1] + 50 && data[i] > data[i+2] + 50) {
                    sumX += (i / 4) % C_WIDTH;
                    count++;
                }
            }

            if (count > 50) {
                lastKnownX = sumX / count; // Update position if found
            }
            return lastKnownX; // Returns last known position if not currently in frame
        }

        function animate() {
            requestAnimationFrame(animate);
            let trackedX = trackRedShaft();
            
            // Logic: Calculate delta of trackedX to determine speed when hitting the ball
            // (Simplified integration for your specific "fast stroke" requirement)
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
